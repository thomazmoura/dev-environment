# fcitx5 keyboard engine config, copied to ~/.config/fcitx5/conf/keyboard.conf
# by cedilla-wayland-setup.sh. Plain typing only: no word hints, emoji or
# long-press popups, and the hint hotkeys (Ctrl+Alt+H, Ctrl+Alt+J) cleared.
EnableEmoji=False
EnableQuickPhraseEmoji=False
EnableHintByDefault=False
EnableLongPress=False
UseNewComposeBehavior=True

