# tmux configuration for WSL2 and the physical Linux host.
#
# Everything shared with the Docker config lives in modules/tmux/common.conf;
# only what is genuinely host-specific belongs below.

source-file ~/.modules/tmux/common.conf

#-------------------------------------------------------#
# Terminal capabilities
#-------------------------------------------------------#
# Windows Terminal wants a different underline-colour sequence than the one
# common.conf sets for everything else.
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0 (wsl2 in Windows Terminal)
}

#-------------------------------------------------------#
# Clipboard
#-------------------------------------------------------#
# clip.exe puts the copy on the Windows clipboard, which is the one the user is
# actually pasting from here.
bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'clip.exe > #{pane_tty}'
# transfer most-recently copied text to attached terminal with yank
bind-key -n M-y run-shell 'tmux save-buffer - | clip.exe > #{pane_tty}'
# transfer previously copied text (chosen from a menu) to attached terminal
bind-key -n M-Y choose-buffer 'run-shell "tmux save-buffer -b \"%%%\" - | clip.exe > #{pane_tty}"'

#-------------------------------------------------------#
# Theme and status bar
#-------------------------------------------------------#
set -g @tmux_power_theme 'sky'
set -g @tmux_power_time_format '%H:%M:%S'
set -g @tmux_power_show_host true
set -g @tmux_power_show_user false

#-------------------------------------------------------#
# Plugins (TPM)
#-------------------------------------------------------#
# These have to stay in this file rather than common.conf -- see the plugin
# section there for why. TPM starts after the theme options above, which is
# when tmux-power reads them.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-power'

run '~/.tmux/plugins/tpm/tpm'

# Workhorse Azure DevOps work item status (requires WORKHORSE_TMUX_QUERY_ID env var).
# The cached wrapper prevents the one-second tmux status refresh from launching
# PowerShell every second. Override its 60-second interval with
# WORKHORSE_TMUX_REFRESH_SECONDS.
run-shell 'tmux set -ga status-left "#[fg=#7aa2f7,bg=default] ##(~/.modules/tmux/scripts/Get-WorkhorseStatusCached.sh 150)"'
