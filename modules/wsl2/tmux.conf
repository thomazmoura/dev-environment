# tmux configuration for WSL2 and the physical Linux host.
#
# Everything shared with the Docker config lives in modules/tmux/common.conf;
# only what is genuinely host-specific belongs below.

#-------------------------------------------------------#
# Theme
#-------------------------------------------------------#
# Read when common.conf builds the theme (modules/tmux/scripts/Set-Theme.sh),
# so it goes before it is sourced. One of gold, everforest, moon, coral, snow,
# forest, violet, redwine and sky, or a #rrggbb colour. TMUX_THEME picks another
# (TMUX_POWER_THEME, its name from the tmux-power days, still works); sky
# otherwise. tmux reads it from the server's environment, so it takes effect
# when the server starts (or on a config reload after
# `tmux set-environment -g TMUX_THEME ...`).
set -g @theme 'sky'
if-shell 'test -n "$TMUX_POWER_THEME"' {
  set -g @theme "$TMUX_POWER_THEME"
}
if-shell 'test -n "$TMUX_THEME"' {
  set -g @theme "$TMUX_THEME"
}

source-file ~/.modules/tmux/common.conf

#-------------------------------------------------------#
# Terminal capabilities
#-------------------------------------------------------#
# Windows Terminal wants a different underline-colour sequence than the one
# common.conf sets for everything else.
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0 (wsl2 in Windows Terminal)
}

#-------------------------------------------------------#
# Clipboard
#-------------------------------------------------------#
# On WSL2, clip.exe puts the copy on the Windows clipboard, which is the one the
# user is actually pasting from there. On the physical Linux host there is no
# clip.exe: yank hands the copy to the attached terminal over OSC 52, as in the
# Docker config.
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'clip.exe > #{pane_tty}'
  # transfer most-recently copied text to the Windows clipboard
  bind-key -N "Copy the last buffer to the clipboard" -n M-y run-shell 'tmux save-buffer - | clip.exe > #{pane_tty}'
  # transfer previously copied text (chosen from a menu) to the Windows clipboard
  bind-key -N "Choose a buffer to copy to the clipboard" -n M-Y choose-buffer 'run-shell "tmux save-buffer -b \"%%%\" - | clip.exe > #{pane_tty}"'
} {
  bind-key -T copy-mode-vi Y send-keys -X copy-pipe '~/.modules/bin-tools/yank > #{pane_tty}'
  # transfer most-recently copied text to attached terminal with yank
  bind-key -N "Copy the last buffer to the clipboard" -n M-y run-shell 'tmux save-buffer - | ~/.modules/bin-tools/yank > #{pane_tty}'
  # transfer previously copied text (chosen from a menu) to attached terminal
  bind-key -N "Choose a buffer to copy to the clipboard" -n M-Y choose-buffer 'run-shell "tmux save-buffer -b \"%%%\" - | ~/.modules/bin-tools/yank > #{pane_tty}"'
}

#-------------------------------------------------------#
# Status bar
#-------------------------------------------------------#
# The segments Set-Theme.sh draws (see the theme section of
# modules/tmux/common.conf); these are the ones that differ from the container.
set -g @status_right_outer ' %H:%M:%S  %d/%m'

# After the window list: the Workhorse work item. The window list itself is not
# drawn (only the active window's index, after the session name), so this
# lands right after the session; Set-Theme.sh draws @status_after_windows in
# the window formats, on the last window (window_end_flag). (Paperboy's unread
# count and the agent count are in @status_right_inner, see the theme section
# of modules/tmux/common.conf.)
#
# Workhorse: the Azure DevOps work item status (requires WORKHORSE_TMUX_QUERY_ID
# env var). The cached wrapper prevents the one-second tmux status refresh from
# launching PowerShell every second. Override its 60-second interval with
# WORKHORSE_TMUX_REFRESH_SECONDS. Drawn only on a machine configured for it:
# Set-StatusSegments.sh sets @workhorse_enabled (and @paperboy_enabled) from the
# PowerShell profile on every config load, and without it neither the segment
# nor its job runs.
#
# prefix+C-k can point Workhorse and Paperboy at the host of an ssh session
# instead (@status_source, see modules/tmux/scripts/Select-StatusSource.sh):
# while it is set, Get-RemoteStatus.sh draws that host's name and Workhorse
# segment here, asked over the session's connection, and its Paperboy count
# beside the agent count, in place of the local ones.
#
# The segments live in user options expanded with E: because a style's commas
# would split the #{?...} conditionals they are drawn in.
set -g @status_workhorse '#[fg=#7aa2f7,bg=default] #(~/.modules/tmux/scripts/Get-WorkhorseStatusCached.sh 150)'
set -g @status_remote '#[bg=default] #(~/.modules/tmux/scripts/Get-RemoteStatus.sh "#{@status_source}" 150)'
set -g @status_after_windows '#{?@status_source,#{E:@status_remote},#{?@workhorse_enabled,#{E:@status_workhorse},}}'
run-shell -b '~/.modules/tmux/scripts/Set-StatusSegments.sh'
