onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "herdr"

[theme]
name = "tokyo-night"
auto_switch = false

# prefix+ctrl+n: fuzzy-find a project under ~/code, then focus the workspace
# already rooted there or build a new one (agent pane + short pwsh pane).
# The herdr counterpart of the tmux prefix+C-n binding. prefix+n stays next_tab.
[[keys.command]]
key = "prefix+ctrl+n"
type = "popup"
command = "$HOME/.modules/herdr/scripts/Open-CodeWorkspace.sh"
width = "60%"
height = "60%"
