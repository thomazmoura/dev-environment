onboarding = false

[ui]
# SpotlightDimmer: the invisible U+2063 marker tells the daemon which Herdr
# workspace this window is showing (docs/HERDR_INTEGRATION.md).
window_title = "{hostname}: {workspace}⁣sd:herdr:{workspace}"
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

[theme]
name = "tokyo-night"
auto_switch = false

# ctrl+alt+h/j/k/l: move focus between panes without the prefix, mirroring the
# tmux C-h/j/k/l bindings in modules/tmux/tmux.conf. ctrl+alt instead of bare
# ctrl because herdr has no is_vim passthrough: a bare ctrl+l binding would
# swallow clear-screen in every pane. prefix+h/j/k/l keeps working.
[keys]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# prefix+ctrl+n: fuzzy-find a project under ~/code, then focus the workspace
# already rooted there or build a new one: one tab per the picked agent CLI, a
# "NeoVim" tab and a "Terminal" tab running pwsh. Picking "NeoVim" in the agent
# picker skips the agent tab.
# The herdr counterpart of the tmux prefix+C-n binding. prefix+n stays next_tab.
[[keys.command]]
key = "prefix+ctrl+n"
type = "popup"
command = "$HOME/.modules/herdr/scripts/Open-CodeWorkspace.sh"
width = "60%"
height = "60%"

# prefix+t: fuzzy-find a tab in the focused workspace by name and switch to it.
# prefix+1..9 only reaches tabs by number and prefix+n/p only cycle, so this is
# the quick way between the agent, "NeoVim" and "Terminal" tabs by name.
# prefix+shift+t stays rename_tab.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "$HOME/.modules/herdr/scripts/Select-Tab.sh"
width = "40%"
height = "40%"

# prefix+/: fuzzy-find one of the workspaces that are already open and focus it.
# Only lists live spaces, where prefix+ctrl+n searches every project under ~/code
# and can build a new one.
[[keys.command]]
key = "prefix+/"
type = "popup"
command = "$HOME/.modules/herdr/scripts/Select-Workspace.sh"
width = "40%"
height = "40%"

# prefix+shift+s: fuzzy-find one of the workspace actions -- open an agent,
# NeoVim or Terminal tab, or start the .NET watch tests, the Angular + .NET
# frontend or the Windows service. The herdr counterpart of the tmux prefix+t
# agent menu and the prefix+T/a/W bindings in modules/wsl2/tmux.conf, except
# that each action opens a tab rather than splitting the current window: tabs
# are what a herdr workspace is built out of, and what prefix+t finds by name.
# The first three rows are the very helpers prefix+ctrl+n uses to build a whole
# workspace, so that binding is these three at once. prefix+s stays settings.
[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "$HOME/.modules/herdr/scripts/Select-Action.sh"
width = "40%"
height = "40%"
