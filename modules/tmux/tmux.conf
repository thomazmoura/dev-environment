# tmux configuration for the Docker image (and anything sourcing it, such as
# DockerUbuntu/tmux.conf).
#
# Everything shared with the WSL2 / physical-host config lives in common.conf;
# only what is genuinely container-specific belongs below.

#-------------------------------------------------------#
# Pane colours
#-------------------------------------------------------#
# The transparent look of the pane backgrounds (common.conf), with the unfocused
# panes shaded. Set before common.conf is sourced, which only fills in the looks
# not set yet and then applies them.
set -g @pane_style_transparent 'fg=colour245,bg=#3c425e'
set -g @pane_active_style_transparent 'fg=colour15,bg=terminal'

source-file ~/.modules/tmux/common.conf

#-------------------------------------------------------#
# Clipboard
#-------------------------------------------------------#
# The container has no Windows clipboard to talk to, so copies are handed to
# the attached terminal with yank over OSC 52.
bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'yank > #{pane_tty}'
# transfer most-recently copied text to attached terminal with yank
bind-key -N "Copy the last buffer to the clipboard" -n M-y run-shell 'tmux save-buffer - | yank > #{pane_tty}'
# transfer previously copied text (chosen from a menu) to attached terminal
bind-key -N "Choose a buffer to copy to the clipboard" -n M-Y choose-buffer 'run-shell "tmux save-buffer -b \"%%%\" - | yank > #{pane_tty}"'

#-------------------------------------------------------#
# Theme and status bar
#-------------------------------------------------------#
set -g @tmux_power_theme 'moon'
set -g @tmux_power_time_format '%H:%M'

#-------------------------------------------------------#
# Plugins (TPM)
#-------------------------------------------------------#
# These have to stay in this file rather than common.conf -- see the plugin
# section there for why. TPM starts after the theme options above, which is
# when tmux-power reads them.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-power'

run '~/.tmux/plugins/tpm/tpm'

# The active window's index after the session name, in place of the window
# list. Right after TPM, as tmux-power assigns both when it loads.
run-shell '~/.modules/tmux/scripts/Set-WindowIndexStatus.sh'

# Workhorse Azure DevOps work item status (requires WORKHORSE_TMUX_QUERY_ID,
# in the environment or the PowerShell profile).
# The cached wrapper prevents frequent tmux status refreshes from launching
# PowerShell every time. Override its 60-second interval with
# WORKHORSE_TMUX_REFRESH_SECONDS.
# Prepend to status-right so it appears after window list but before time/date
set -g @status_workhorse '#[fg=#7aa2f7,bg=default]#(~/.modules/tmux/scripts/Get-WorkhorseStatusCached.sh 120) '
run-shell 'SR=$(tmux show -gqv status-right); tmux set -g status-right "##{?@workhorse_enabled,##{E:@status_workhorse},}$SR"'

# Paperboy: the Exchange inbox unread count, which paperboy.nvim's daemon
# writes to a file every minute (started on prefix+M, see
# scripts/Start-PaperboyUnread.sh). This only reads that file, and shows an
# orange lock while the daemon is not running.
set -g @status_paperboy '#(~/.modules/tmux/scripts/Get-PaperboyUnread.sh)'
run-shell 'SR=$(tmux show -gqv status-right); tmux set -g status-right "##{?@paperboy_enabled,##{E:@status_paperboy},}$SR"'

# Each is drawn only on a machine configured for it: Set-StatusSegments.sh sets
# @workhorse_enabled / @paperboy_enabled from the PowerShell profile on every
# config load, and without them neither the segment nor its job runs. They
# live in user options expanded with E: because a style's commas would split
# the #{?...} conditionals they are drawn in.
run-shell -b '~/.modules/tmux/scripts/Set-StatusSegments.sh'

# agent-radar: how many coding agents are waiting on you / working, read off
# their screens. This only reads a file: one sampler process
# (agent-radar/scripts/Start-AgentRadar.py) detects once a second for the whole
# machine and publishes the rendered segment, which matters because tmux
# refreshes the status bar on far more than the status-interval timer and the
# detector shells out to ps and capture-pane. The argument is how stale that
# file may get before this restarts the sampler, not a refresh interval.
#
# Prepended AFTER the TPM run above for the same reason the Workhorse segment is:
# tmux-power assigns status-right wholesale when it loads, so anything set before
# it is silently dropped. `##(` rather than `#(` keeps the format literal in the
# option value instead of running it once here at config time.
run-shell 'SR=$(tmux show -gqv status-right); tmux set -g status-right "##(~/.modules/agent-radar/scripts/Get-AgentSummary.sh 3) $SR"'

# Toasts (scripts/Show-Toast.sh), first in status-right so a new one lands where
# the eye already goes for the agent count. Empty, it draws nothing. `#{@toast}`
# and not `#{E:@toast}`: the toast's #[...] styles apply either way, but E:
# would also expand a `#{...}` that happens to be in the message text.
run-shell 'SR=$(tmux show -gqv status-right); tmux set -g status-right "##{@toast}$SR"'
