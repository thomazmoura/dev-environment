# Bindings that replace a tmux default in the native table (prefix+C-b).
#
# Sourced by scripts/Set-NativeKeyTable.sh right after it has copied tmux's
# defaults into that table. They cannot live in common.conf with the rest: the
# table is filled once that file has been read, so a binding made there would
# be replaced by the default it was meant to override.

# prefix+C-b ? lists every binding with a note (-N): the custom ones and tmux's
# own. Its default list-keys -N covers only the root and prefix tables, so the
# second-key menus and the native table are appended after it, each labelled
# with the keys that reach it. The output lands in the same view mode (/ to
# search, q to quit).
bind -N "List key bindings" -T native ? {
  list-keys -N
  list-keys -N -P "C-Space t " -T custom-t-menu
  list-keys -N -P "C-Space t - " -T custom-t-below-menu
  list-keys -N -P "C-Space - " -T custom-below-menu
  list-keys -N -P "C-Space C-b " -T native
}
