# Shared tmux configuration.
#
# Sourced by both modules/tmux/tmux.conf (the Docker image) and
# modules/wsl2/tmux.conf (WSL2 and the physical Linux host). Everything that
# should behave the same in every environment lives here; each of those two
# files keeps only what genuinely differs -- the clipboard bridge, the theme,
# pane colours and where the Workhorse status goes.
#
# Anything that shells out lives in modules/tmux/scripts/ rather than inline in
# a binding: the scripts are readable, commented and testable, and the same
# helper (scripts/tmux-helpers.sh) labels every pane the same way.

set -sg escape-time 0

#-------------------------------------------------------#
# Terminal capabilities
#-------------------------------------------------------#
# Terminfo bridging: tmux interposes its own terminfo, so truecolor,
# undercurl, coloured underlines and italics all have to be re-declared
# here. These lines are a no-op when the host terminal is Ghostty or
# WezTerm (both support all of it natively) but are still needed over
# SSH and in containers, where the host terminal is unknown.
set -g default-terminal "tmux-256color"
set -g terminal-overrides ',xterm-256color:Tc'
set -ag terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',xterm*:sitm=\E[3m'                  # italics
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'               # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underline colours - needs tmux-3.0

# Fix focus events for vim
set -g focus-events on

# Panes may set the clipboard with OSC 52 -- that is how anything running over
# ssh (prefix+N) reaches this machine's clipboard: yank, the wl-copy shim in
# modules/clipboard and NeoVim's "+ all print OSC 52 on the remote, and tmux
# keeps it as a paste buffer and forwards it to the terminal. The feature line
# makes sure tmux knows the terminal takes it even if its terminfo lacks Ms.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'
# Also let DCS-wrapped escapes through to the terminal (older OSC 52 emitters)
set -g allow-passthrough on

#-------------------------------------------------------#
# General behaviour
#-------------------------------------------------------#
set-option -g mouse on
set-option -g status-position top
set-window-option -g mode-keys vi

# Closing a session moves the client to the most recently used remaining one
# instead of dropping out of tmux; with nothing left, tmux exits as usual.
set-option -g detach-on-destroy off

# Pane status. @pane_label is set by scripts/tmux-helpers.sh when a binding
# opens a pane, and is what Select-Pane.sh lists panes by. The border falls back
# to the pane title for panes created any other way -- and the option is needed
# on top of the title because pwsh rewrites the title through OSC 2.
set-option -g allow-rename off
set -g pane-border-status bottom
set -g pane-border-format "#{?@pane_label,#{@pane_label},#{pane_title}}-(#P)"

# Enable terminal title updates, with "tmux" in it for easy detection.
# The tail is for SpotlightDimmer (harmless where it doesn't run): "#T" carries
# the pane title, which is how a neovim reached over ssh reports its focused
# split, and the marker after it is U+2063 INVISIBLE SEPARATOR followed by the
# client tty, which is how the daemon finds the tmux client behind a Ghostty
# window ("TtySource": "title"). The separator renders as nothing, so the title
# still reads as tmux:<session>/<window> - "<pane title>".
set-option -g set-titles on
set-option -g set-titles-string 'tmux:#S/#W - "#T"⁣sd:#{client_tty}'

set -s command-alias[100] 'kw=kill-window'

# Every fuzzy picker opens as a centred popup instead of taking over a split.
# The geometry is named once here so the bindings below read as "popup <script>";
# -x C -y C is tmux's own default, spelled out because Invoke-Popup.sh's
# SpotlightDimmer wrapper assumes a centred popup (see that script's header).
set -s command-alias[101] 'popup=display-popup -E -w 80% -h 60% -x C -y C'

#-------------------------------------------------------#
# Prefix: custom keys first, tmux's own behind C-b
#-------------------------------------------------------#
# The prefix is C-Space, and its table holds only the bindings in this file.
# Every tmux default moves one key further away, to prefix+C-b -- the ones
# this file overrides as well, so prefix+C-b t is still the clock and
# prefix+C-b 1 still window 1. C-b itself goes back to the programs in the
# panes.
#
# The prefix table is emptied first, so a default this file does not rebind
# is not left behind in it; the bindings below re-add themselves, and on a
# reload TPM re-runs tmux-sensible, which binds prefix+C-Space to send-prefix
# (C-Space twice hands a C-Space to NeoVim) and prefix+R to reload.
#
# The native table is copied from a config-less tmux rather than written out
# here, so it follows whichever tmux is installed; see
# scripts/Set-NativeKeyTable.sh. -b because the script calls back into tmux.
set -g prefix C-Space
unbind -a -T prefix
run-shell -b '$HOME/.modules/tmux/scripts/Set-NativeKeyTable.sh'
bind -N "Menu: tmux's built-in bindings" C-b switch-client -T native

#-------------------------------------------------------#
# Pane navigation
#-------------------------------------------------------#
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
#
# An nvim in an ssh session (prefix+N) runs on the remote, where the only
# process on the pane's tty is ssh, and outside any tmux, so it cannot hand an
# edge back to this one either. It says instead, in its pane title, which ways
# it still has a window to go: nvim-nav=<some of hjkl> (tmux-navigation in
# modules/vim/lua/ai-settings.lua). A key goes to it when its letter is there,
# and moves the tmux pane when it is not. The title is matched as a format,
# never handed to a shell: any remote program can set it. nvim takes the title
# back when it exits or is suspended, so a shell left behind gets no keys.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -N "Move to the pane or NeoVim split on the left" -n 'C-h' if-shell -F '#{m:nvim-nav=*h*,#{pane_title}}' { send-keys C-h } { if-shell "$is_vim" { send-keys C-h } { select-pane -L } }
bind-key -N "Move to the pane or NeoVim split below" -n 'C-j' if-shell -F '#{m:nvim-nav=*j*,#{pane_title}}' { send-keys C-j } { if-shell "$is_vim" { send-keys C-j } { select-pane -D } }
bind-key -N "Move to the pane or NeoVim split above" -n 'C-k' if-shell -F '#{m:nvim-nav=*k*,#{pane_title}}' { send-keys C-k } { if-shell "$is_vim" { send-keys C-k } { select-pane -U } }
bind-key -N "Move to the pane or NeoVim split on the right" -n 'C-l' if-shell -F '#{m:nvim-nav=*l*,#{pane_title}}' { send-keys C-l } { if-shell "$is_vim" { send-keys C-l } { select-pane -R } }
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -N 'Move to the last pane' -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -N 'Move to the last pane' -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# C-v in an ssh session (prefix+N) sends the image on this machine's clipboard
# to the remote and pastes its path, which is how the remote's Claude Code gets
# a pasted image (scripts/Send-ClipboardImage.sh). Without an image, and in
# local sessions, the pane gets the C-v itself.
bind-key -N "Paste (in ssh: send the clipboard image to the remote)" -n 'C-v' if-shell -F '#{@ssh_target}' \
  { run-shell -b '$HOME/.modules/tmux/scripts/Send-ClipboardImage.sh "#{pane_id}"' } \
  { send-keys C-v }

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind -N "Zoom the pane and enter copy mode" Z 'resize-pane -Z; copy-mode'

# Close every pane in this window except the current one -- the big brother of
# tmux's own kill-pane (prefix+C-b x), and asks first the same way. The prompt counts what is
# about to go; with nothing else in the window it just says so instead.
bind -N "Close every other pane in the window" X if-shell -F '#{>:#{window_panes},1}' \
  'confirm-before -p "Close the other #{e|-:#{window_panes},1} pane(s) in this window? (y/n)" "kill-pane -a"' \
  'display-message "No other panes in this window"'

#-------------------------------------------------------#
# Number keys: panes first, windows behind Meta
#-------------------------------------------------------#
# prefix+N jumps to pane N of the current window -- the number the pane border
# already shows as -(N). Windows move to prefix+M-N. tmux's own number keys --
# windows on 0-9 and the layout presets on M-1..M-7 -- are still there behind
# prefix+C-b.
bind -N "Select pane 0" 0 select-pane -t :.0
bind -N "Select pane 1" 1 select-pane -t :.1
bind -N "Select pane 2" 2 select-pane -t :.2
bind -N "Select pane 3" 3 select-pane -t :.3
bind -N "Select pane 4" 4 select-pane -t :.4
bind -N "Select pane 5" 5 select-pane -t :.5
bind -N "Select pane 6" 6 select-pane -t :.6
bind -N "Select pane 7" 7 select-pane -t :.7
bind -N "Select pane 8" 8 select-pane -t :.8
bind -N "Select pane 9" 9 select-pane -t :.9
bind -N "Select window 0" M-0 select-window -t :=0
bind -N "Select window 1" M-1 select-window -t :=1
bind -N "Select window 2" M-2 select-window -t :=2
bind -N "Select window 3" M-3 select-window -t :=3
bind -N "Select window 4" M-4 select-window -t :=4
bind -N "Select window 5" M-5 select-window -t :=5
bind -N "Select window 6" M-6 select-window -t :=6
bind -N "Select window 7" M-7 select-window -t :=7
bind -N "Select window 8" M-8 select-window -t :=8
bind -N "Select window 9" M-9 select-window -t :=9

#-------------------------------------------------------#
# Fuzzy pickers (popups)
#-------------------------------------------------------#
# Switch to another session
bind -N "Switch to another session" C-p popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/Select-Session.sh'
bind -N "Switch to another session" / popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/Select-Session.sh'
# Open a session for any project under ~/code, with the standard layout
bind -N "New session for a project under ~/code" C-n popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/New-CodeSession.sh'
# The same, for ~/code itself
bind -N "New session for ~/code" C-c popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/New-CodeSession.sh "$HOME/code"'
# The same on another machine: asks for user@host, fuzzy-finds a directory under
# the remote's ~/code and opens a session whose panes are all ssh'd into it.
# Every pane binding below keeps working there -- it opens a fresh ssh into that
# directory and runs its command on the remote -- except the git and agent
# feeds, which stay local and ask the host (prefix+t then r, A and R, below). See
# modules/tmux/scripts/New-SshSession.sh and ssh-helpers.sh. While every open
# ssh session is on one host, it skips the user@host question and picks a
# directory there; Esc in that picker asks for a host after all.
bind -N "New ssh session on another machine" N popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/New-SshSession.sh'

#-------------------------------------------------------#
# Layouts and tool panes
#-------------------------------------------------------#
# Every one of these runs with -b: the scripts call back into tmux, and a
# blocking run-shell would hold the server while they do it. #{pane_id} is
# passed explicitly so the script never has to guess which pane the binding
# fired from.

# The standard layout -- Git and Agents down the left, and a picker pane that
# asks whether it should be NeoVim, a terminal or one of the agents below (Enter
# alone is NeoVim) and turns into it. v builds, repairs and resizes it; V forces
# the NeoVim layout instead, creating a missing NeoVim and terminal row. Neither
# ever types into a pane that is already there: a window with no layout keeps
# its panes and gets the radar column beside them. The picker only takes over
# the first pane of a brand-new session; anywhere else, Space opens one.
bind -N "Build or repair the standard layout" v run-shell -b '$HOME/.modules/tmux/scripts/Set-NeovimLayout.sh "#{pane_id}"'
bind -N "Build or repair the NeoVim layout" V run-shell -b '$HOME/.modules/tmux/scripts/Set-NeovimLayout.sh -f "#{pane_id}"'

# NeoVim in a pane of its own, on the right (e) or below (- then e). E, and
# - then E, open it bare instead -- nvim -u NORC, no config or plugins, straight
# from bash with no pwsh. tmux's own E (select-layout -E, spread panes evenly)
# is prefix+C-b E.
bind -N "NeoVim pane on the right" e run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -t "#{pane_id}" NeoVim'
bind -N "NeoVim pane below" -T custom-below-menu e run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -v -t "#{pane_id}" NeoVim'
bind -N "Bare NeoVim (NORC) pane on the right" E run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -t "#{pane_id}" "NeoVim (NORC)"'
bind -N "Bare NeoVim (NORC) pane below" -T custom-below-menu E run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -v -t "#{pane_id}" "NeoVim (NORC)"'

# A new picker pane -- NeoVim, a terminal or an agent, asked for once it is
# open -- on the right (Space) or below (- then Space). tmux's own Space
# (next-layout) is prefix+C-b Space.
bind -N "Picker pane on the right" Space run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -t "#{pane_id}" Picker'
bind -N "Picker pane below" -T custom-below-menu Space run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -v -t "#{pane_id}" Picker'

# Plain terminals, labelled, in place of tmux's own splits (still on
# prefix+C-b % and "). The first one in a window with no layout terminal takes
# that role, so prefix+v sizes it as the terminal row.
bind -N "Terminal pane on the right" % run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -r terminal -t "#{pane_id}" "Terminal" ""'
bind -N "Terminal pane below" '"' run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -r terminal -v -t "#{pane_id}" "Terminal" ""'

# A throwaway pwsh in a popup, in the current pane's directory, for a quick
# command that should not disturb the layout. Closes when the shell exits. In an
# ssh session it runs on the remote, in the session's directory, like the
# terminal splits above (scripts/New-PopupShell.sh).
bind -N "Throwaway pwsh popup in the pane's directory" P popup -d '#{pane_current_path}' '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/New-PopupShell.sh "#{pane_id}"'

# AI coding agents, on a second key so the single letters stay free.
# Lowercase starts a fresh session, uppercase resumes the last one.
# A - before the last key opens the same pane below instead of on the right
# (prefix+t then - then c); every pane-opening key here has that twin.
bind -N "Menu: agents, feeds, worktrees, scripts (then - for below)" t switch-client -T custom-t-menu
bind -N "Open the next pane below instead of on the right" -T custom-t-menu - switch-client -T custom-t-below-menu
bind -N "Claude Code" -T custom-t-menu c run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Claude Code" "claude"'
bind -N "Claude Code (below)" -T custom-t-below-menu c run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Claude Code" "claude"'
bind -N "Claude Code, resumed" -T custom-t-menu C run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Claude Code" "claude --resume"'
bind -N "Claude Code, resumed (below)" -T custom-t-below-menu C run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Claude Code" "claude --resume"'
bind -N "Codex" -T custom-t-menu x run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Codex" "codex"'
bind -N "Codex (below)" -T custom-t-below-menu x run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Codex" "codex"'
bind -N "Codex, resumed" -T custom-t-menu X run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Codex" "codex resume"'
bind -N "Codex, resumed (below)" -T custom-t-below-menu X run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Codex" "codex resume"'
bind -N "Copilot" -T custom-t-menu p run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Copilot" "Use-NodeVersion && copilot --max-ai-credits 500"'
bind -N "Copilot (below)" -T custom-t-below-menu p run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Copilot" "Use-NodeVersion && copilot --max-ai-credits 500"'
bind -N "Copilot, resumed" -T custom-t-menu P run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Copilot" "Use-NodeVersion && copilot --resume --max-ai-credits 500"'
bind -N "Copilot, resumed (below)" -T custom-t-below-menu P run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Copilot" "Use-NodeVersion && copilot --resume --max-ai-credits 500"'
bind -N "Open Code" -T custom-t-menu o run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Open Code" "nvs use latest && opencode"'
bind -N "Open Code (below)" -T custom-t-below-menu o run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Open Code" "nvs use latest && opencode"'
bind -N "Open Code, continued" -T custom-t-menu O run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -t "#{pane_id}" "Open Code" "nvs use latest && opencode --continue"'
bind -N "Open Code, continued (below)" -T custom-t-below-menu O run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -t "#{pane_id}" "Open Code" "nvs use latest && opencode --continue"'

# The repository's .notes in a NeoVim as bare as prefix+E's but for tmux
# navigation and a transparent background (vim/notes.vimrc) -- the same
# pane the layout puts under Agents when the file exists (Set-NeovimLayout.sh).
bind -N "Repository .notes pane" -T custom-t-menu n run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -t "#{pane_id}" Notes'
bind -N "Repository .notes pane (below)" -T custom-t-below-menu n run-shell -b '$HOME/.modules/tmux/scripts/Select-PaneKind.sh -v -t "#{pane_id}" Notes'
# Jump to whichever agent is waiting for you. agent-radar reads each agent's
# screen rather than waiting to be told what it is doing, so this covers agents
# started outside these bindings and cannot show a stale state.
#   a  one-shot popup picker
#   A  a live-refreshing list in a normal pane, opened labelled like any other
#   r  the same live pane without fzf's chrome -- state first, nothing animates
# A and r take -L, which keeps them local in an ssh session too (prefix+N): the
# agents in its panes run on the remote, but their screens are here, so the
# local feed lists them itself and only asks the host which pane holds which
# agent. See modules/agent-radar/README.md.
bind -N "Jump to an agent (popup picker)" -T custom-t-menu a popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/agent-radar/scripts/Select-Agent.sh'
bind -N "Live agents pane" -T custom-t-menu A run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -L -t "#{pane_id}" -l 35% "Agents" "& ~/.modules/agent-radar/scripts/Watch-Agents.sh"'
bind -N "Live agents pane (below)" -T custom-t-below-menu A run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -L -t "#{pane_id}" -l 35% "Agents" "& ~/.modules/agent-radar/scripts/Watch-Agents.sh"'
bind -N "Live agents feed pane" -T custom-t-menu r run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -L -t "#{pane_id}" -l 35% "Agents" "& ~/.modules/agent-radar/scripts/Watch-AgentFeed.py"'
bind -N "Live agents feed pane (below)" -T custom-t-below-menu r run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -L -t "#{pane_id}" -l 35% "Agents" "& ~/.modules/agent-radar/scripts/Watch-AgentFeed.py"'

# The same idea for the other question you ask across a screenful of sessions:
# where did I leave each repository. One row per session -- branch, commits to
# push/pull, and counts of added/modified/deleted/untracked files -- refreshed
# from a single sampler the same way the agent feed is. It never fetches, so a
# tick costs no network; press f in the pane to fetch the selected repository.
#
# -L keeps it local in an ssh session too (prefix+N), where every other pane
# runs on the remote: the feed lists the ssh sessions alongside the local ones
# and asks each host's git-radar about its own. See modules/git-radar/README.md.
bind -N "Live git feed pane" -T custom-t-menu R run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -L -t "#{pane_id}" -l 35% "Git" "& ~/.modules/git-radar/scripts/Watch-GitFeed.py"'
bind -N "Live git feed pane (below)" -T custom-t-below-menu R run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -L -t "#{pane_id}" -l 35% "Git" "& ~/.modules/git-radar/scripts/Watch-GitFeed.py"'

# Git worktrees. w asks for a name, creates ~/code/<repo>.worktrees/<name> on a
# branch of the same name -- off whatever this pane has checked out -- records it
# in ~/.worktrees and opens a session on it with the standard layout. W opens the
# manager: this repository's worktrees (a for every registered one, on every
# machine), / to filter, Enter to open, d to delete. The shared logic is in
# modules/tmux/scripts/worktree-helpers.sh.
#
# w's popup is its own, not the `popup` alias: it asks one question, so a
# screen-sized popup would be mostly empty. -d starts it in the pane's path,
# which is how New-Worktree.sh knows which repository you mean.
#
# In an ssh session (prefix+N) both do the same thing on the remote. The pane's
# path is the local shell's there and says nothing about the repository, so -t
# hands over the pane as well: from it the scripts read the session's
# @ssh_target and @ssh_dir, make the worktree beside the repository on that
# host and open an ssh session on it. -L on W for the same reason the feeds
# have it -- the registry the manager keeps, and the sessions it opens and
# kills, are this machine's; it asks the hosts about their own rows itself.
bind -N "New git worktree and session" -T custom-t-menu w display-popup -E -w 60 -h 10 -x C -y C -d '#{pane_current_path}' '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/New-Worktree.sh -t "#{pane_id}"'
bind -N "Worktree manager pane" -T custom-t-menu W run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -L -t "#{pane_id}" -l 35% "Worktrees" "& $HOME/.modules/tmux/scripts/Show-Worktrees.py"'
bind -N "Worktree manager pane (below)" -T custom-t-below-menu W run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -L -t "#{pane_id}" -l 35% "Worktrees" "& $HOME/.modules/tmux/scripts/Show-Worktrees.py"'

# Your own scripts, from modules/scripts/library. The picker lists whatever is
# in that folder -- described by each script's own first comment line, so there
# is no registry to keep in step -- and opens the one you choose in a labelled
# pane, in the current pane's directory. Invoke-Script.sh works out how to run
# it from the extension (.sh -> bash, .ps1 -> pwsh, .py -> python3) or its
# shebang, and holds the pane open on a keypress so a script that finishes in a
# second does not take its output with it. S runs the chosen script in the
# picker's own popup instead, for one you only want to glance at; -d starts the
# popup in the pane's path, which is where a pane would have run it. See
# modules/scripts/README.md.
bind -N "Run a script from the library" -T custom-t-menu s popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/scripts/scripts/Select-Script.sh'
bind -N "Run a script from the library in a popup" -T custom-t-menu S popup -d '#{pane_current_path}' '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/scripts/scripts/Select-Script.sh -p'
bind -N "Run a script from the library (below)" -T custom-t-below-menu s popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/scripts/scripts/Select-Script.sh -v'

# Pull this dev-environment clone and reload the config the way prefix+I does,
# in a popup that closes when it is done (and stays open on a failed pull).
# The clone is found through ~/.modules, so it works wherever it was cloned;
# see modules/tmux/scripts/Update-DevEnvironment.sh.
bind -N "Update dev-environment and reload config" -T custom-t-menu u display-popup -E -w 80 -h 15 -x C -y C '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/Update-DevEnvironment.sh'

# Jump to any pane of any session interactively
bind -N "Jump to any pane of any session" -T custom-t-menu t popup '$HOME/.modules/tmux/scripts/Invoke-Popup.sh $HOME/.modules/tmux/scripts/Select-Pane.sh'

# Angular + .NET runners. They cd into sibling directories by glob, so they
# depend on the pane's current path -- which is why New-ToolPane.sh splits with
# -c '#{pane_current_path}'. Each one passes that same glob to -d, so firing a
# runner from a directory that has no matching project says so and closes on a
# keypress instead of opening a pane full of pwsh's "Cannot find path".
#
# As in prefix+t, a - before the key opens the runner below instead of on the
# right (prefix+- then a).
bind -N "Open the next pane below instead of on the right" - switch-client -T custom-below-menu
bind -N "Frontend (.NET + Angular) pane" a run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -d "*Angular" -t "#{pane_id}" "Frontend (.NET + Angular)" "cd *Angular && nvs use auto && Install-NpmIfNeeded && Start-Frontend"'
bind -N "Frontend (.NET + Angular) pane (below)" -T custom-below-menu a run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -d "*Angular" -t "#{pane_id}" "Frontend (.NET + Angular)" "cd *Angular && nvs use auto && Install-NpmIfNeeded && Start-Frontend"'
# prefix+A opens both halves of the app: the second pane is split off the first
# (New-ToolPane.sh prints its pane id) so the two share the column the first one
# took, and focus goes back to the pane the binding fired from. The - variant
# passes -v to both, so Angular opens below and ApiInterface below Angular.
bind -N "Angular and ApiInterface panes" A run-shell -b 'angular=$($HOME/.modules/tmux/scripts/New-ToolPane.sh -d "*Angular" -P -t "#{pane_id}" "Angular" "cd *Angular && nvs use auto && Install-NpmIfNeeded && npms"); \
                     $HOME/.modules/tmux/scripts/New-ToolPane.sh -d "*ApiInterface" -t "$angular" "ApiInterface" "cd *ApiInterface && dwr"; \
                     tmux select-pane -t "#{pane_id}"'
bind -N "Angular and ApiInterface panes (below)" -T custom-below-menu A run-shell -b 'angular=$($HOME/.modules/tmux/scripts/New-ToolPane.sh -v -d "*Angular" -P -t "#{pane_id}" "Angular" "cd *Angular && nvs use auto && Install-NpmIfNeeded && npms"); \
                     $HOME/.modules/tmux/scripts/New-ToolPane.sh -v -d "*ApiInterface" -t "$angular" "ApiInterface" "cd *ApiInterface && dwr"; \
                     tmux select-pane -t "#{pane_id}"'
bind -N ".NET watch test pane" T run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -d "*Testes" -t "#{pane_id}" ".NET Watch Test" "cd *Testes/ && dwt"'
bind -N ".NET watch test pane (below)" -T custom-below-menu T run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -d "*Testes" -t "#{pane_id}" ".NET Watch Test" "cd *Testes/ && dwt"'
bind -N ".NET Windows Service pane" W run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -d "*WinService" -t "#{pane_id}" ".NET Windows Service" "cd *WinService && dotnet watch run"'
bind -N ".NET Windows Service pane (below)" -T custom-below-menu W run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -d "*WinService" -t "#{pane_id}" ".NET Windows Service" "cd *WinService && dotnet watch run"'
bind -N ".NET API pane" B run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -d "*API" -t "#{pane_id}" ".NET API" "cd *API && dotnet watch run"'
bind -N ".NET API pane (below)" -T custom-below-menu B run-shell -b '$HOME/.modules/tmux/scripts/New-ToolPane.sh -v -d "*API" -t "#{pane_id}" ".NET API" "cd *API && dotnet watch run"'

#-------------------------------------------------------#
# Key list
#-------------------------------------------------------#
# prefix+? lists every binding with a note (-N): the ones above and tmux's own.
# Its default list-keys -N covers only the root and prefix tables, so the
# second-key menus and the native table are appended after it, each labelled
# with the keys that reach it. The output lands in the same view mode (/ to search, q to quit).
bind -N "List key bindings" ? {
  list-keys -N
  list-keys -N -P "C-Space t " -T custom-t-menu
  list-keys -N -P "C-Space t - " -T custom-t-below-menu
  list-keys -N -P "C-Space - " -T custom-below-menu
  list-keys -N -P "C-Space C-b " -T native
}

#-------------------------------------------------------#
# Hooks
#-------------------------------------------------------#
# Arriving in a session puts that session's git feed back on its own row. The
# feed pane cannot notice the switch itself -- it is not the pane that gains the
# focus -- and polling tmux for it would cost about 14ms per feed pane per tick,
# which is the very thing the focus events in modules/tmux/scripts/radar_ui.py
# exist to avoid. The script sends the feed one keypress instead; see
# modules/tmux/scripts/Sync-RadarSelection.sh.
#
# client-session-changed is every switch; client-attached is arriving from a
# fresh terminal, which is a switch as far as the feed is concerned.
#
# Registered by append-and-probe rather than a plain `set-hook -g`, because -g
# assigns the whole array for an event and would silently delete entries
# belonging to anything else hooking it -- SpotlightDimmer hooks both of these.
# -ag appends, but appends unconditionally, and a tmux config is sourced more
# than once in practice (TPM re-sources ~/.tmux.conf as it loads plugins), so
# the probe is what keeps it from stacking up duplicates.
#
# -b for the same reason every run-shell above uses it: the script calls back
# into tmux, and a blocking run-shell holds the server while it does. The
# session name is passed in rather than asked for inside the script: a hook's
# run-shell has no client of its own to resolve a format against.
#
# `##{session_name}` is escaped on purpose. This run-shell expands formats in
# its own command line, so a bare `#{session_name}` would be replaced with
# whatever session happened to be current while the config was being read, and
# every hook would then name that one session forever. `##` is tmux's escape for
# a literal `#`, so what gets stored in the hook is the format itself, expanded
# when the hook fires.
run-shell -b 'sync="$HOME/.modules/tmux/scripts/Sync-RadarSelection.sh"; \
  for hook in client-session-changed client-attached; do \
    tmux show-options -g "$hook" 2>/dev/null | grep -q Sync-RadarSelection \
      || tmux set-hook -ag "$hook" "run-shell -b \"$sync ##{session_name}\""; \
  done'

# An ssh session (prefix+N) draws the theme in a colour of its own -- violet
# unless @ssh_theme_colour says otherwise -- so it cannot be mistaken for a local
# one. The colour lives in the session's own options, which is why switching
# back to a local session brings the local theme back by itself. New-SshSession.sh
# themes a session as it opens it; arriving in one re-themes it, which covers
# the sessions opened before this and a reloaded config. Local sessions return
# at once. See modules/tmux/scripts/Set-SshTheme.sh.
#
# Appended, probed and escaped for the same reasons as the block above.
run-shell -b 'theme="$HOME/.modules/tmux/scripts/Set-SshTheme.sh"; \
  for hook in client-session-changed client-attached; do \
    tmux show-options -g "$hook" 2>/dev/null | grep -q Set-SshTheme \
      || tmux set-hook -ag "$hook" "run-shell -b \"$theme ##{session_name}\""; \
  done'

# Wake the radar samplers when something closes, rather than leaving its row on
# screen for the rest of a tick -- up to three seconds, for git-radar. Both
# radars from one script, since a closed session is a git-radar row and any
# agent that was in it.
#
# pane-exited is a command in a pane quitting; pane-died is the same with
# remain-on-exit set; session-closed is a whole session going. No arguments:
# the hook says only that something changed, and the next sample decides what.
# The git feed nudges directly for its own kills, knowing before tmux tells
# anyone; this covers every other way a session ends.
#
# Appended and probed for the same reasons as the block above -- -g would
# assign the whole array for the event and delete anything else hooking it, and
# -ag alone would stack duplicates every time TPM re-sources the config.
run-shell -b 'nudge="$HOME/.modules/tmux/scripts/Request-RadarSample.sh"; \
  for hook in pane-exited pane-died session-closed; do \
    tmux show-options -g "$hook" 2>/dev/null | grep -q Request-RadarSample \
      || tmux set-hook -ag "$hook" "run-shell -b \"$nudge\""; \
  done'

# Put a picker pane back in a laid-out window (prefix+v, or a new session) whose
# last pane but the Git and Agents feeds has just closed -- or whose very last
# pane has, which keeps the window open. pane-died hands over the pane itself,
# kept dead by the remain-on-exit Set-NeovimLayout.sh turns on, and is where
# every other dead pane gets closed; after-kill-pane (prefix+C-b x) names no
# pane, so the script checks every layout window. See
# modules/tmux/scripts/Restore-PickerPane.sh.
#
# Appended, probed and escaped as above: `##{hook_pane}` has to be expanded when
# the hook fires, not while the config is read.
run-shell -b 'restore="$HOME/.modules/tmux/scripts/Restore-PickerPane.sh"; \
  tmux show-options -g pane-died 2>/dev/null | grep -q Restore-PickerPane \
    || tmux set-hook -ag pane-died "run-shell -b \"$restore ##{hook_pane}\""; \
  tmux show-options -g after-kill-pane 2>/dev/null | grep -q Restore-PickerPane \
    || tmux set-hook -ag after-kill-pane "run-shell -b \"$restore\""'

# Offer to remove a worktree made with prefix+t, w once its session closes --
# if it is clean. One with changes is kept and the status line says so. The
# question is a popup on whichever client is left; see
# modules/tmux/scripts/Close-WorktreeSession.sh, which also returns at once for
# the sessions that are not worktrees.
#
# Appended and probed as above. `##{hook_session_name}` is escaped for the same
# reason `##{session_name}` is in the first block: this run-shell expands
# formats once while the config is read, and the name has to be expanded when
# the hook fires -- by which point the session is gone, so hook_session_name is
# the only place it is still available.
run-shell -b 'close="$HOME/.modules/tmux/scripts/Close-WorktreeSession.sh"; \
  tmux show-options -g session-closed 2>/dev/null | grep -q Close-WorktreeSession \
    || tmux set-hook -ag session-closed "run-shell -b \"$close ##{hook_session_name}\""'

# Take the unlocked ssh key off a remote once the last session on that host
# has closed. prefix+N unlocks it in one agent per host so the panes don't each
# ask for the password; this is the other end of that, so the key is held only
# while there is a session using it. See modules/tmux/scripts/Close-SshAgent.sh
# and the shared agent in ssh-helpers.sh.
#
# Appended and probed as above. No format to escape: the script works out
# which hosts are left for itself.
run-shell -b 'agent="$HOME/.modules/tmux/scripts/Close-SshAgent.sh"; \
  tmux show-options -g session-closed 2>/dev/null | grep -q Close-SshAgent \
    || tmux set-hook -ag session-closed "run-shell -b \"$agent\""'

#-------------------------------------------------------#
# Plugins (TPM)
#-------------------------------------------------------#
# Only the shared plugin *options* live here. The `set -g @plugin` lines and the
# `run` that starts TPM stay in the sourcing config, and have to:
# TPM does not read @plugin from tmux's option table, it greps the text of
# ~/.tmux.conf and of the files that config sources -- one level deep only (see
# _sourced_files in ~/.tmux/plugins/tpm/scripts/helpers/plugin_functions.sh).
# A @plugin line down here is two levels from ~/.tmux.conf, so TPM would never
# see it and the plugins would silently not load.
set -g @tmux_power_date_format '%d/%m/%Y'
